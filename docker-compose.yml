services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma-contenidos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plataforma_contenidos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d plataforma_contenidos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
